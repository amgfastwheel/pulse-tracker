<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pulse — Dashboard</title>
<meta name="theme-color" content="#1a1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png" type="image/png">
<style>
  :root {
    --bg-0: #1a1220;
    --bg-1: #241528;
    --card: rgba(255, 255, 255, 0.055);
    --card-strong: rgba(255, 255, 255, 0.09);
    --border: rgba(255, 255, 255, 0.10);
    --text: #f4f0f6;
    --muted: #a79fb0;
    --accent: #f472b6;
    --accent-2: #a78bfa;
    --up: #34d399;
    --down: #fb7185;
    --flat: #a79fb0;
    --input-bg: rgba(255, 255, 255, 0.06);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  body.light {
    --bg-0: #f6f3fb;
    --bg-1: #efe9f7;
    --card: rgba(255, 255, 255, 0.65);
    --card-strong: rgba(255, 255, 255, 0.85);
    --border: rgba(28, 27, 46, 0.08);
    --text: #241f33;
    --muted: #7c7590;
    --accent: #ec4899;
    --accent-2: #8b5cf6;
    --up: #059669;
    --down: #e11d48;
    --flat: #7c7590;
    --input-bg: rgba(28, 27, 46, 0.04);
    --shadow: 0 10px 34px rgba(120, 90, 160, 0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -8%, var(--bg-1) 0%, transparent 60%),
      radial-gradient(700px 480px at -10% 30%, rgba(167, 139, 250, 0.16) 0%, transparent 55%),
      radial-gradient(800px 520px at 55% 110%, rgba(244, 114, 182, 0.14) 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .4s ease;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 6px 18px rgba(244,114,182,.35); }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
  .link-btn { text-decoration: none; width: auto; padding: 0 14px; font-size: 14px; font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(14px); box-shadow: var(--shadow); }
  .card .label { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 21px; font-weight: 750; line-height: 1.15; }
  .card .note { color: var(--muted); font-size: 11px; margin-top: 5px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; backdrop-filter: blur(14px); box-shadow: var(--shadow); }
  .panel h2 { font-size: 13px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }

  /* chart */
  .chart { display: flex; gap: 10px; align-items: flex-end; height: 180px; overflow-x: auto; padding: 4px 2px 0; }
  .chart .grp { flex: 0 0 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .bars { display: flex; gap: 4px; align-items: flex-end; height: 150px; }
  .chart .bar { width: 14px; border-radius: 4px 4px 0 0; min-height: 2px; transition: height .4s ease; }
  .chart .bar.income { background: linear-gradient(180deg, var(--up), #7ee2c0); }
  .chart .bar.expense { background: linear-gradient(180deg, var(--down), #f9a8d4); }
  .chart .grp .m { font-size: 10px; color: var(--muted); margin-top: 6px; }
  .chart .grp .nv { font-size: 10px; margin-top: 1px; font-weight: 600; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.inc { background: var(--up); }
  .dot.exp { background: var(--down); }

  /* table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  th, td { text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  td.month { font-weight: 600; }
  td.inc { color: var(--up); }
  td.exp { color: var(--down); }
  td.net.pos { color: var(--up); }
  td.net.neg { color: var(--down); }
  td.bal { font-weight: 600; }
  tr.total-row td { font-weight: 750; border-top: 2px solid var(--border); border-bottom: none; }

  .empty-state { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; }
  .empty-state .big { font-size: 34px; margin-bottom: 10px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); font-family: inherit; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; }
  .btn:active { transform: scale(.97); }
  #fileInput { display: none; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>Pulse Dashboard</h1>
        <div class="sub">Monthly statement — all your months at a glance</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="icon-btn link-btn" href="./index.html" title="Open tracker">↩ Tracker</a>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>Income vs expenses by month</h2>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><i class="dot inc"></i> Income</span>
      <span><i class="dot exp"></i> Expenses</span>
    </div>
  </section>

  <section class="panel">
    <h2>Monthly statement</h2>
    <div class="table-wrap" id="tableWrap"></div>
  </section>

  <section class="panel">
    <h2>Data</h2>
    <div class="actions">
      <button class="btn" id="exportBtn">⬇ Export data (JSON)</button>
      <button class="btn" id="importBtn">⬆ Import data</button>
      <input type="file" id="fileInput" accept="application/json,.json">
      <button class="btn" id="clearBtn" style="color:var(--down);">Clear all</button>
    </div>
    <p style="color:var(--muted);font-size:12px;margin:14px 0 0;">Data lives in this browser. Export/import to move it between devices or between this page and the tracker.</p>
  </section>

  <footer>
    <a href="./index.html">Open the tracker</a> to add or edit entries.
  </footer>
</div>

<script>
(function () {
  const STORE_KEY = 'pulse-tracker-v2';
  const THEME_KEY = 'pulse-theme';
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object' && d.months) return d;
      }
    } catch (e) {}
    return null;
  }

  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function sumBy(key, type) {
    if (!state || !state.months[key]) return 0;
    return state.months[key].filter(i => i.type === type).reduce((a, i) => a + (num(i.amount) || 0), 0);
  }
  function fmt(n) {
    const sym = state && state.currency ? state.currency : 'RM';
    const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '-' : '') + sym + s;
  }
  function monthLabel(key) { const [y, m] = key.split('-').map(Number); return MONTH_NAMES[m-1] + ' ' + y; }
  function monthShort(key) { const [y, m] = key.split('-').map(Number); return MONTH_NAMES[m-1].slice(0,3); }

  function buildRows() {
    if (!state) return [];
    const keys = Object.keys(state.months).sort();
    return keys.map(k => {
      const inc = sumBy(k, 'income');
      const exp = sumBy(k, 'expense');
      const net = inc - exp;
      return { key: k, inc, exp, net };
    });
  }

  function render() {
    const rows = buildRows();

    if (!state || rows.length === 0) {
      document.getElementById('cards').innerHTML = '';
      document.getElementById('chart').innerHTML = '';
      document.getElementById('tableWrap').innerHTML =
        '<div class="empty-state"><div class="big">📊</div>No data found yet.<br>Open the <a href="./index.html" style="color:var(--accent)">tracker</a> to add entries, or import a JSON file below.</div>';
      return;
    }

    renderCards(rows);
    renderChart(rows);
    renderTable(rows);
  }

  function renderCards(rows) {
    const totalInc = rows.reduce((a, r) => a + r.inc, 0);
    const totalExp = rows.reduce((a, r) => a + r.exp, 0);
    const totalNet = totalInc - totalExp;
    const monthsCount = rows.length;
    const avgNet = monthsCount ? totalNet / monthsCount : 0;

    let best = rows[0], worst = rows[0];
    rows.forEach(r => { if (r.net > best.net) best = r; if (r.net < worst.net) worst = r; });

    const cards = [
      { label: 'Total income', value: fmt(totalInc), note: 'across ' + monthsCount + ' months', cls: 'up' },
      { label: 'Total expenses', value: fmt(totalExp), note: 'across ' + monthsCount + ' months', cls: 'down' },
      { label: 'Net balance', value: fmt(totalNet), note: 'avg ' + fmt(avgNet) + ' / month', cls: totalNet >= 0 ? 'up' : 'down' },
      { label: 'Best month', value: monthLabel(best.key), note: fmt(best.net), cls: 'up' },
    ];
    document.getElementById('cards').innerHTML = cards.map(c =>
      '<div class="card"><div class="label">' + c.label + '</div><div class="value ' + c.cls + '">' + c.value + '</div><div class="note">' + c.note + '</div></div>'
    ).join('');
  }

  function renderChart(rows) {
    const max = Math.max(1, ...rows.map(r => Math.max(r.inc, r.exp)));
    const shown = rows.slice(-12); // last 12 months
    document.getElementById('chart').innerHTML = shown.map(r => {
      const incH = Math.round(r.inc / max * 140);
      const expH = Math.round(r.exp / max * 140);
      return '<div class="grp">' +
        '<div class="bars">' +
          '<div class="bar income" style="height:' + (Math.max(2, incH)) + 'px" title="Income ' + fmt(r.inc) + '"></div>' +
          '<div class="bar expense" style="height:' + (Math.max(2, expH)) + 'px" title="Expenses ' + fmt(r.exp) + '"></div>' +
        '</div>' +
        '<div class="m">' + monthShort(r.key) + '</div>' +
        '<div class="nv ' + (r.net >= 0 ? 'up' : 'down') + '">' + fmt(r.net) + '</div>' +
      '</div>';
    }).join('');
  }

  function renderTable(rows) {
    let running = 0;
    const body = rows.map(r => {
      running += r.net;
      const netCls = r.net >= 0 ? 'pos' : 'neg';
      return '<tr>' +
        '<td class="month">' + monthLabel(r.key) + '</td>' +
        '<td class="inc">' + fmt(r.inc) + '</td>' +
        '<td class="exp">' + fmt(r.exp) + '</td>' +
        '<td class="net ' + netCls + '">' + fmt(r.net) + '</td>' +
        '<td>' + (r.inc > 0 ? Math.round(r.net / r.inc * 100) + '%' : '—') + '</td>' +
        '<td class="bal">' + fmt(running) + '</td>' +
      '</tr>';
    }).join('');

    const totalInc = rows.reduce((a, r) => a + r.inc, 0);
    const totalExp = rows.reduce((a, r) => a + r.exp, 0);
    const totalNet = totalInc - totalExp;

    document.getElementById('tableWrap').innerHTML =
      '<table>' +
        '<thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th><th>Saved</th><th>Balance</th></tr></thead>' +
        '<tbody>' + body +
        '<tr class="total-row"><td>Total</td><td class="inc">' + fmt(totalInc) + '</td><td class="exp">' + fmt(totalExp) + '</td><td>' + fmt(totalNet) + '</td><td>—</td><td>' + fmt(totalNet) + '</td></tr>' +
        '</tbody>' +
      '</table>';
  }

  // theme
  function applyTheme() {
    const theme = localStorage.getItem(THEME_KEY) || 'dark';
    document.body.classList.toggle('light', theme === 'light');
    document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
  }

  // export / import
  document.getElementById('exportBtn').addEventListener('click', () => {
    const data = state || {};
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pulse-data.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d || typeof d !== 'object' || !d.months) throw new Error('bad');
        state = d;
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        render();
      } catch (err) {
        alert('That file doesn\'t look like valid Pulse data.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('Clear ALL data? This cannot be undone.')) {
      localStorage.removeItem(STORE_KEY);
      state = null;
      render();
    }
  });

  document.getElementById('themeBtn').addEventListener('click', () => {
    const theme = document.body.classList.contains('light') ? 'dark' : 'light';
    localStorage.setItem(THEME_KEY, theme);
    applyTheme();
  });

  applyTheme();
  render();
})();
</script>
</body>
</html>
