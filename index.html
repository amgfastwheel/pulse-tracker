<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse — Income &amp; Expense Tracker</title>
<meta name="theme-color" content="#1a1220">
<meta name="description" content="Track income and expenses, compare months, and record Apple Pay spends via Shortcuts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<style>
  :root {
    --bg-0: #1a1220;
    --bg-1: #241528;
    --card: rgba(255, 255, 255, 0.055);
    --card-strong: rgba(255, 255, 255, 0.09);
    --border: rgba(255, 255, 255, 0.10);
    --text: #f4f0f6;
    --muted: #a79fb0;
    --accent: #f472b6;
    --accent-2: #a78bfa;
    --ink: #1c1b2e;
    --up: #34d399;
    --down: #fb7185;
    --flat: #a79fb0;
    --input-bg: rgba(255, 255, 255, 0.06);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  body.light {
    --bg-0: #f6f3fb;
    --bg-1: #efe9f7;
    --card: rgba(255, 255, 255, 0.65);
    --card-strong: rgba(255, 255, 255, 0.85);
    --border: rgba(28, 27, 46, 0.08);
    --text: #241f33;
    --muted: #7c7590;
    --accent: #ec4899;
    --accent-2: #8b5cf6;
    --ink: #241f33;
    --up: #059669;
    --down: #e11d48;
    --flat: #7c7590;
    --input-bg: rgba(28, 27, 46, 0.04);
    --shadow: 0 10px 34px rgba(120, 90, 160, 0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -8%, var(--bg-1) 0%, transparent 60%),
      radial-gradient(700px 480px at -10% 30%, rgba(167, 139, 250, 0.16) 0%, transparent 55%),
      radial-gradient(800px 520px at 55% 110%, rgba(244, 114, 182, 0.14) 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
    box-shadow: 0 6px 18px rgba(244, 114, 182, 0.35);
  }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .brand .sub { color: var(--muted); font-size: 12px; }

  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
  }
  .icon-btn:active { transform: scale(0.94); }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .seg {
    display: flex; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; gap: 4px; flex: 1; min-width: 180px;
    backdrop-filter: blur(10px);
  }
  .seg button {
    flex: 1; border: none; background: transparent; color: var(--muted);
    padding: 9px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .2s ease;
  }
  .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  .month-nav { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px 6px; backdrop-filter: blur(10px); }
  .month-nav button { width: 34px; height: 34px; border: none; background: transparent; color: var(--text); font-size: 18px; cursor: pointer; border-radius: 8px; }
  .month-nav button:active { background: var(--card-strong); }
  .month-nav input[type="month"] {
    background: transparent; color: var(--text); border: none; font-size: 14px; font-weight: 600;
    padding: 6px 2px; max-width: 132px; outline: none; font-family: inherit;
  }
  .month-nav input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .6; }
  body.light .month-nav input[type="month"]::-webkit-calendar-picker-indicator { filter: none; }

  .toolbar select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 10px; font-size: 13px; backdrop-filter: blur(10px); font-family: inherit;
  }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 620px) { .stats { grid-template-columns: 1fr; } }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; backdrop-filter: blur(14px); box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat::after {
    content: ""; position: absolute; inset: 0; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); opacity: 0;
    transition: opacity .3s ease; pointer-events: none;
  }
  .stat .label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
  .stat .value { font-size: 27px; font-weight: 750; letter-spacing: .3px; line-height: 1.1; }
  .stat .delta { font-size: 13px; margin-top: 7px; font-weight: 600; }
  .stat .delta .ic { margin-right: 2px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }

  /* ---------- bars ---------- */
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 16px; backdrop-filter: blur(14px); box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 13px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .bar-row { margin-bottom: 13px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
  .bar-head .amt { font-weight: 700; }
  .bar-head .meta { color: var(--muted); font-size: 11px; }
  .bar-track { background: var(--input-bg); border-radius: 7px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; transition: width .45s cubic-bezier(.4,0,.2,1); }
  .bar-fill.this { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .bar-fill.prior { background: var(--card-strong); }

  /* ---------- entry lists ---------- */
  .group { margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .group-head .title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .group-head .sum { font-size: 15px; font-weight: 700; }
  .group-head .sum.income { color: var(--up); }
  .group-head .sum.expense { color: var(--down); }

  .entry {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 8px; backdrop-filter: blur(10px);
  }
  .entry .top { display: flex; gap: 8px; align-items: center; }
  .entry .top input.desc {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 15px; padding: 4px 0; outline: none; min-width: 0; font-family: inherit;
  }
  .entry .del { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; width: 26px; height: 26px; border-radius: 8px; line-height: 1; }
  .entry .del:active { background: var(--card-strong); color: var(--down); }
  .entry .bottom { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .entry .bottom select.cat {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 8px; font-size: 13px; min-width: 0; font-family: inherit; flex: 1;
  }
  .entry .bottom input.amt {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 10px; font-size: 15px; text-align: right; width: 128px; font-family: inherit;
    outline: none; -webkit-appearance: none;
  }
  .entry .bottom input.amt:focus, .entry .bottom select.cat:focus { border-color: var(--accent); }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }

  .add-btn {
    margin-top: 10px; width: 100%; background: transparent; color: var(--accent);
    border: 1px dashed var(--border); border-radius: 12px; padding: 11px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .add-btn:active { background: var(--card-strong); }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  footer button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 4px; }
  footer button:active { color: var(--down); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 30px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(244, 114, 182, 0.45);
    z-index: 40;
  }
  .fab:active { transform: scale(0.92); }

  /* ---------- modal sheet ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 520px; background: var(--bg-1); border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideUp .28s cubic-bezier(.4,0,.2,1);
    border: 1px solid var(--border); border-bottom: none;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet h3 { margin: 0 0 16px; font-size: 17px; }
  .sheet .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .sheet .type-toggle button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .sheet .type-toggle button.active.income { background: rgba(52, 211, 153, 0.18); color: var(--up); border-color: rgba(52, 211, 153, 0.4); }
  .sheet .type-toggle button.active.expense { background: rgba(251, 113, 133, 0.18); color: var(--down); border-color: rgba(251, 113, 133, 0.4); }
  .sheet .field { margin-bottom: 12px; }
  .sheet label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .sheet input, .sheet select {
    width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; font-size: 16px; outline: none; font-family: inherit; -webkit-appearance: none;
  }
  .sheet input:focus, .sheet select:focus { border-color: var(--accent); }
  .sheet .amount-row { display: flex; gap: 8px; align-items: center; }
  .sheet .amount-row input { font-size: 26px; font-weight: 700; flex: 1; }
  .sheet .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet .sheet-actions button { flex: 1; padding: 14px; border-radius: 13px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  .sheet .sheet-actions .cancel { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
  .sheet .sheet-actions .save { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--card-strong); border: 1px solid var(--border); color: var(--text);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 60; backdrop-filter: blur(14px);
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>Pulse</h1>
        <div class="sub">Income &amp; expense, month over month</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="month-nav">
      <button id="prevBtn" title="Previous month">‹</button>
      <input type="month" id="refMonth">
      <button id="nextBtn" title="Next month">›</button>
    </div>
    <select id="currency" title="Currency">
      <option value="RM">RM</option>
      <option value="$">$</option>
      <option value="S$">S$</option>
      <option value="¥">¥</option>
      <option value="€">€</option>
      <option value="£">£</option>
      <option value="฿">฿</option>
    </select>
  </div>

  <section class="stats">
    <div class="stat">
      <div class="label">💵 Income</div>
      <div class="value up" id="statIncome">—</div>
      <div class="delta" id="statIncomeDelta">—</div>
    </div>
    <div class="stat">
      <div class="label">💸 Expenses</div>
      <div class="value down" id="statExpense">—</div>
      <div class="delta" id="statExpenseDelta">—</div>
    </div>
    <div class="stat">
      <div class="label">⚖️ Net</div>
      <div class="value" id="statNet">—</div>
      <div class="delta" id="statNetDelta">—</div>
    </div>
  </section>

  <section class="panel">
    <h2>Net — this month vs prior month</h2>
    <div class="bar-row">
      <div class="bar-head">
        <span id="barThisLabel">This month</span>
        <span><span class="amt" id="barThisAmt">—</span> <span class="meta" id="barThisMeta"></span></span>
      </div>
      <div class="bar-track"><div class="bar-fill this" id="barThis" style="width:0%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-head">
        <span id="barPriorLabel">Prior month</span>
        <span><span class="amt" id="barPriorAmt">—</span> <span class="meta" id="barPriorMeta"></span></span>
      </div>
      <div class="bar-track"><div class="bar-fill prior" id="barPrior" style="width:0%"></div></div>
    </div>
  </section>

  <div class="toolbar" style="margin-bottom:14px;">
    <div class="seg" id="viewSeg">
      <button class="active" data-view="this">This month</button>
      <button data-view="prior">Prior month</button>
    </div>
  </div>

  <section class="panel" id="listPanel">
    <div class="group" id="incomeGroup">
      <div class="group-head">
        <span class="title">⬆ Income</span>
        <span class="sum income" id="incomeSum">—</span>
      </div>
      <div id="incomeList"></div>
      <button class="add-btn" id="incomeAdd">+ Add income</button>
    </div>
    <div class="group" id="expenseGroup">
      <div class="group-head">
        <span class="title">⬇ Expenses</span>
        <span class="sum expense" id="expenseSum">—</span>
      </div>
      <div id="expenseList"></div>
      <button class="add-btn" id="expenseAdd">+ Add expense</button>
    </div>
  </section>

  <footer>
    Saved on this device only. <button id="clearBtn">Clear all data</button>
  </footer>
</div>

<button class="fab" id="fab" title="Quick add">＋</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>Quick add</h3>
    <div class="type-toggle">
      <button id="tExpense" class="active expense" data-t="expense">Expense</button>
      <button id="tIncome" data-t="income">Income</button>
    </div>
    <div class="field">
      <label>Amount</label>
      <div class="amount-row">
        <span id="curPrefix" style="font-size:20px;font-weight:700;color:var(--muted);"></span>
        <input type="number" id="qaAmount" inputmode="decimal" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>
    <div class="field">
      <label>Note</label>
      <input type="text" id="qaNote" placeholder="e.g. Coffee, Salary…">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="qaCat"></select>
    </div>
    <div class="sheet-actions">
      <button class="cancel" id="qaCancel">Cancel</button>
      <button class="save" id="qaSave">Add entry</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const STORE_KEY = 'pulse-tracker-v2';
  const THEME_KEY = 'pulse-theme';
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const CATEGORIES = {
    income: [
      { id: 'salary', label: 'Salary', icon: '💼' },
      { id: 'freelance', label: 'Freelance', icon: '🧑‍💻' },
      { id: 'side', label: 'Side project', icon: '🚀' },
      { id: 'invest', label: 'Investment', icon: '📈' },
      { id: 'gift', label: 'Gift', icon: '🎁' },
      { id: 'other', label: 'Other', icon: '✨' },
    ],
    expense: [
      { id: 'food', label: 'Food', icon: '🍜' },
      { id: 'transport', label: 'Transport', icon: '🚗' },
      { id: 'bills', label: 'Bills', icon: '🧾' },
      { id: 'shopping', label: 'Shopping', icon: '🛍️' },
      { id: 'fun', label: 'Fun', icon: '🎮' },
      { id: 'health', label: 'Health', icon: '🩺' },
      { id: 'other', label: 'Other', icon: '✨' },
    ],
  };

  function catById(type, id) {
    const list = CATEGORIES[type];
    return list.find(c => c.id === id) || list[list.length - 1];
  }
  function catLabel(type, id) { const c = catById(type, id); return (c.icon ? c.icon + ' ' : '') + c.label; }

  // ---------- state ----------
  let state = load();
  let viewMode = 'this'; // 'this' | 'prior'
  let quickType = 'expense';

  function defaultState() {
    const now = new Date();
    const thisKey = yyyymm(now);
    const priorKey = addMonths(thisKey, -1);
    return {
      currency: 'RM',
      refMonth: thisKey,
      months: {
        [priorKey]: [
          { id: uid(), type: 'income', desc: 'Salary', amount: 4800, category: 'salary' },
          { id: uid(), type: 'income', desc: 'Freelance', amount: 1200, category: 'freelance' },
          { id: uid(), type: 'expense', desc: 'Rent', amount: 1400, category: 'bills' },
          { id: uid(), type: 'expense', desc: 'Groceries', amount: 620, category: 'food' },
        ],
        [thisKey]: [
          { id: uid(), type: 'income', desc: 'Salary', amount: 4800, category: 'salary' },
          { id: uid(), type: 'income', desc: 'Freelance', amount: 2100, category: 'freelance' },
          { id: uid(), type: 'income', desc: 'Side project', amount: 400, category: 'side' },
          { id: uid(), type: 'expense', desc: 'Rent', amount: 1400, category: 'bills' },
          { id: uid(), type: 'expense', desc: 'Dining out', amount: 385, category: 'food' },
        ],
      },
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object' && d.months) return migrate(d);
      }
    } catch (e) {}
    return defaultState();
  }
  function migrate(d) {
    if (!d.currency) d.currency = 'RM';
    if (!d.refMonth) d.refMonth = yyyymm(new Date());
    Object.keys(d.months).forEach(k => {
      d.months[k].forEach(it => { if (!it.type) it.type = 'income'; if (!it.category) it.category = 'other'; });
    });
    return d;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function yyyymm(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function addMonths(key, delta) {
    const [y, m] = key.split('-').map(Number);
    return yyyymm(new Date(y, m - 1 + delta, 1));
  }
  function monthLabel(key) { const [y, m] = key.split('-').map(Number); return MONTH_NAMES[m-1] + ' ' + y; }
  function monthTag(key) { const [y, m] = key.split('-').map(Number); return MONTH_NAMES[m-1].slice(0,3) + ' ' + y; }
  function itemsOf(key) { if (!state.months[key]) state.months[key] = []; return state.months[key]; }
  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function sumBy(key, type) { return itemsOf(key).filter(i => i.type === type).reduce((a, i) => a + (num(i.amount) || 0), 0); }
  function fmt(n) {
    const sym = state.currency;
    const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '-' : '') + sym + s;
  }
  function currentMonthKey() { return yyyymm(new Date()); }

  // ---------- rendering ----------
  function render() {
    const thisKey = state.refMonth;
    const priorKey = addMonths(thisKey, -1);

    document.getElementById('refMonth').value = thisKey;
    document.getElementById('currency').value = state.currency;
    document.getElementById('curPrefix').textContent = state.currency;

    document.getElementById('barThisLabel').textContent = monthTag(thisKey);
    document.getElementById('barPriorLabel').textContent = monthTag(priorKey);

    renderSeg();
    renderSummary(thisKey, priorKey);
    renderList(viewKey());
  }

  function viewKey() { return viewMode === 'this' ? state.refMonth : addMonths(state.refMonth, -1); }

  function renderSeg() {
    const thisKey = state.refMonth;
    const priorKey = addMonths(thisKey, -1);
    document.querySelectorAll('#viewSeg button').forEach(b => {
      const v = b.dataset.view;
      b.classList.toggle('active', v === viewMode);
      b.textContent = v === 'this' ? monthTag(thisKey) : monthTag(priorKey);
    });
  }

  function renderSummary(thisKey, priorKey) {
    const incThis = sumBy(thisKey, 'income');
    const expThis = sumBy(thisKey, 'expense');
    const netThis = incThis - expThis;
    const incPrior = sumBy(priorKey, 'income');
    const expPrior = sumBy(priorKey, 'expense');
    const netPrior = incPrior - expPrior;

    document.getElementById('statIncome').textContent = fmt(incThis);
    document.getElementById('statExpense').textContent = fmt(expThis);
    const netEl = document.getElementById('statNet');
    netEl.textContent = fmt(netThis);
    netEl.className = 'value ' + (netThis > 0 ? 'up' : netThis < 0 ? 'down' : 'flat');

    // income delta
    renderDelta('statIncomeDelta', incThis - incPrior, false);
    // expense delta (inverted coloring)
    renderDelta('statExpenseDelta', expThis - expPrior, true);
    // net delta
    const netDiff = netThis - netPrior;
    renderDelta('statNetDelta', netDiff, false);
    // append savings rate to net delta
    const rate = incThis > 0 ? (netThis / incThis) * 100 : 0;
    document.getElementById('statNetDelta').textContent += ' · ' + Math.max(0, rate).toFixed(0) + '% saved';

    // bars (net)
    const max = Math.max(Math.abs(netThis), Math.abs(netPrior), 0.01);
    const thisPct = Math.max(0, netThis) / max * 100;
    const priorPct = Math.max(0, netPrior) / max * 100;
    document.getElementById('barThis').style.width = thisPct + '%';
    document.getElementById('barPrior').style.width = priorPct + '%';
    document.getElementById('barThisAmt').textContent = fmt(netThis);
    document.getElementById('barPriorAmt').textContent = fmt(netPrior);
    document.getElementById('barThisMeta').textContent = 'in ' + fmt(incThis) + ' · out ' + fmt(expThis);
    document.getElementById('barPriorMeta').textContent = 'in ' + fmt(incPrior) + ' · out ' + fmt(expPrior);
    if (netThis < 0) document.getElementById('barThis').style.background = 'linear-gradient(90deg, var(--down), #f9a8d4)';
    else document.getElementById('barThis').style.background = 'linear-gradient(90deg, var(--accent), var(--accent-2))';
  }

  function renderDelta(elId, diff, invert) {
    const el = document.getElementById(elId);
    let cls, arrow, label;
    if (diff > 0) { cls = invert ? 'down' : 'up'; arrow = '▲'; label = 'more'; }
    else if (diff < 0) { cls = invert ? 'up' : 'down'; arrow = '▼'; label = 'less'; }
    else { cls = 'flat'; arrow = '—'; label = 'same'; }
    el.className = 'delta ' + cls;
    el.textContent = arrow + ' ' + fmt(Math.abs(diff)) + ' ' + label + ' vs prior';
  }

  function renderList(key) {
    const inc = itemsOf(key).filter(i => i.type === 'income');
    const exp = itemsOf(key).filter(i => i.type === 'expense');

    document.getElementById('incomeSum').textContent = fmt(sumBy(key, 'income'));
    document.getElementById('expenseSum').textContent = fmt(sumBy(key, 'expense'));

    renderGroup('incomeList', key, inc, 'income');
    renderGroup('expenseList', key, exp, 'expense');
  }

  function renderGroup(elId, key, list, type) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    if (list.length === 0) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = type === 'income' ? 'No income yet.' : 'No expenses yet.';
      el.appendChild(d);
      return;
    }
    list.forEach(it => {
      const row = document.createElement('div');
      row.className = 'entry';

      const top = document.createElement('div');
      top.className = 'top';
      const desc = document.createElement('input');
      desc.type = 'text'; desc.className = 'desc'; desc.placeholder = 'Description';
      desc.value = it.desc || '';
      desc.addEventListener('input', e => { it.desc = e.target.value; save(); });
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×'; del.title = 'Remove';
      del.addEventListener('click', () => {
        state.months[key] = state.months[key].filter(x => x.id !== it.id);
        save(); render();
      });
      top.appendChild(desc); top.appendChild(del);

      const bottom = document.createElement('div');
      bottom.className = 'bottom';
      const cat = document.createElement('select');
      cat.className = 'cat';
      CATEGORIES[type].forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = (c.icon ? c.icon + ' ' : '') + c.label;
        if (c.id === it.category) o.selected = true;
        cat.appendChild(o);
      });
      cat.addEventListener('change', e => { it.category = e.target.value; save(); });
      const amt = document.createElement('input');
      amt.type = 'number'; amt.className = 'amt'; amt.inputMode = 'decimal';
      amt.min = '0'; amt.step = '0.01'; amt.placeholder = '0.00';
      amt.value = it.amount != null ? it.amount : '';
      amt.addEventListener('input', e => {
        it.amount = e.target.value === '' ? '' : num(e.target.value);
        save(); refreshNumbers();
      });
      bottom.appendChild(cat); bottom.appendChild(amt);

      row.appendChild(top); row.appendChild(bottom);
      el.appendChild(row);
    });
  }

  function refreshNumbers() {
    const thisKey = state.refMonth;
    renderSummary(thisKey, addMonths(thisKey, -1));
    const key = viewKey();
    document.getElementById('incomeSum').textContent = fmt(sumBy(key, 'income'));
    document.getElementById('expenseSum').textContent = fmt(sumBy(key, 'expense'));
  }

  // ---------- quick add modal ----------
  function openQuick(type) {
    quickType = type || 'expense';
    document.getElementById('overlay').classList.add('open');
    document.getElementById('tExpense').classList.toggle('active', quickType === 'expense');
    document.getElementById('tIncome').classList.toggle('active', quickType === 'income');
    buildCatOptions(quickType);
    const amt = document.getElementById('qaAmount');
    amt.value = '';
    document.getElementById('qaNote').value = '';
    setTimeout(() => amt.focus(), 80);
  }
  function closeQuick() { document.getElementById('overlay').classList.remove('open'); }

  function buildCatOptions(type) {
    const sel = document.getElementById('qaCat');
    sel.innerHTML = '';
    CATEGORIES[type].forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = (c.icon ? c.icon + ' ' : '') + c.label;
      sel.appendChild(o);
    });
  }

  function commitQuick() {
    const amount = num(document.getElementById('qaAmount').value);
    if (!(amount > 0)) { toast('Enter an amount first'); return; }
    const note = document.getElementById('qaNote').value.trim();
    const cat = document.getElementById('qaCat').value;
    // record into the real current month
    const key = currentMonthKey();
    itemsOf(key).push({ id: uid(), type: quickType, desc: note || (quickType === 'income' ? 'Income' : 'Expense'), amount, category: cat });
    save();
    state.refMonth = key;
    viewMode = 'this';
    render();
    closeQuick();
    toast((quickType === 'income' ? '➕ Income ' : '➖ Expense ') + fmt(amount) + ' recorded');
  }

  // ---------- deep-link ingestion (Apple Shortcuts) ----------
  function ingestQuery() {
    const params = new URLSearchParams(location.search);
    if (!params.has('add')) return;
    const type = params.get('add') === 'expense' ? 'expense' : 'income';
    const amount = num(params.get('amount'));
    if (!(amount > 0)) { history.replaceState(null, '', location.pathname); return; }
    const note = params.get('note') || (type === 'income' ? 'Income' : 'Expense');
    const cat = params.get('cat') || (type === 'income' ? 'other' : 'other');
    const key = currentMonthKey();
    itemsOf(key).push({ id: uid(), type, desc: note, amount, category: catById(type, cat).id });
    save();
    state.refMonth = key;
    viewMode = 'this';
    // strip query so a refresh doesn't double-record
    history.replaceState(null, '', location.pathname);
    toast((type === 'income' ? '➕ ' : '➖ ') + fmt(amount) + ' · ' + note);
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- theme ----------
  function applyTheme() {
    const theme = localStorage.getItem(THEME_KEY) || 'dark';
    document.body.classList.toggle('light', theme === 'light');
    document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    const theme = document.body.classList.contains('light') ? 'dark' : 'light';
    localStorage.setItem(THEME_KEY, theme);
    applyTheme();
  }

  // ---------- events ----------
  document.getElementById('prevBtn').addEventListener('click', () => { state.refMonth = addMonths(state.refMonth, -1); save(); render(); });
  document.getElementById('nextBtn').addEventListener('click', () => { state.refMonth = addMonths(state.refMonth, 1); save(); render(); });
  document.getElementById('refMonth').addEventListener('change', e => { if (e.target.value) { state.refMonth = e.target.value; save(); render(); } });
  document.getElementById('currency').addEventListener('change', e => { state.currency = e.target.value; save(); render(); });
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  document.querySelectorAll('#viewSeg button').forEach(b => {
    b.addEventListener('click', () => { viewMode = b.dataset.view; render(); });
  });

  document.getElementById('incomeAdd').addEventListener('click', () => {
    itemsOf(viewKey()).push({ id: uid(), type: 'income', desc: '', amount: '', category: 'other' });
    save(); render();
  });
  document.getElementById('expenseAdd').addEventListener('click', () => {
    itemsOf(viewKey()).push({ id: uid(), type: 'expense', desc: '', amount: '', category: 'other' });
    save(); render();
  });

  document.getElementById('fab').addEventListener('click', () => openQuick('expense'));
  document.getElementById('tExpense').addEventListener('click', () => { quickType = 'expense'; document.getElementById('tExpense').classList.add('active'); document.getElementById('tIncome').classList.remove('active'); buildCatOptions('expense'); });
  document.getElementById('tIncome').addEventListener('click', () => { quickType = 'income'; document.getElementById('tIncome').classList.add('active'); document.getElementById('tExpense').classList.remove('active'); buildCatOptions('income'); });
  document.getElementById('qaCancel').addEventListener('click', closeQuick);
  document.getElementById('qaSave').addEventListener('click', commitQuick);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeQuick(); });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('Clear ALL data? This cannot be undone.')) {
      localStorage.removeItem(STORE_KEY);
      state = defaultState();
      save(); render();
    }
  });

  // ---------- init ----------
  applyTheme();
  ingestQuery();
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
